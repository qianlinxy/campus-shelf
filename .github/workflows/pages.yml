name: Publish Campus Shelf to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source and run tests
        run: |
          npm ci --ignore-scripts
          npm run check
          npm test
      - name: Generate public site configuration
        env:
          BACKEND_PROVIDER: ${{ vars.BACKEND_PROVIDER || 'cloudbase' }}
          CLOUDBASE_ENV_ID: ${{ vars.CLOUDBASE_ENV_ID || 'monetary-dinosaur-d0d39pf87e5f20' }}
          CLOUDBASE_REGION: ${{ vars.CLOUDBASE_REGION || 'ap-shanghai' }}
          CLOUDBASE_PUBLISHABLE_KEY: ${{ vars.CLOUDBASE_PUBLISHABLE_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://qianlinxy.github.io/campus-shelf/' }}
          ENROLLMENT_ENABLED: ${{ vars.ENROLLMENT_ENABLED }}
          STUDY_ID: ${{ vars.STUDY_ID || 'almab-factorial-test-v4' }}
          PHONE_AUTH_ENABLED: ${{ vars.PHONE_AUTH_ENABLED }}
          CONSENT_VERSION: ${{ vars.CONSENT_VERSION }}
          INFORMATION_URL_ZH: ${{ vars.INFORMATION_URL_ZH }}
          INFORMATION_URL_EN: ${{ vars.INFORMATION_URL_EN }}
          INFORMATION_URL_UR: ${{ vars.INFORMATION_URL_UR }}
        run: node tools/prepare-github-pages.cjs
      - name: Build portable preview
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
