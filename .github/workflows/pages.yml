name: Publish Campus Shelf to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source and run tests
        run: |
          npm ci --ignore-scripts
          npm run check
          npm test
      - name: Verify public site configuration
        run: node -e "require('./dist/config.js');const A=require('./dist/auth-core.js');const c=globalThis.CAMPUS_CONFIG;if(!A.configReady(c))throw new Error('CAMPUS_CONFIG is not ready');console.log('config ready:',A.provider(c));"
      - name: Build portable preview
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
