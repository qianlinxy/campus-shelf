<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>Campus Shelf · 研究管理</title>
<link rel="stylesheet" href="admin.css?v=f806b37e8938"><link rel="icon" href="data:,"><script src="config.js?v=ccaace8bd0c9" defer></script><script src="auth-core.js?v=92ceec5424fb" defer></script><script src="backend.js?v=0994adaf2731" defer></script><script src="core.js?v=daf69d59b38a" defer></script><script src="data.js?v=94a274389f76" defer></script><script src="admin-core.js?v=d1257f4f60f7" defer></script><script src="admin-text.js?v=9b8999865bdd" defer></script><script src="admin.js?v=ccec5caf1241" defer></script></head>
<body><header class="admin-header"><a href="./" class="brand">campusshelf<span> / research</span></a><nav class="languages" aria-label="Language" dir="ltr"><button data-lang="zh" lang="zh-CN">中文</button><button data-lang="en" lang="en">English</button><button data-lang="ur" lang="ur" dir="rtl">اردو</button></nav></header>
<main><div class="page-heading"><div><p class="eyebrow">ALMAB · STUDY OPERATIONS</p><h1 data-text="title"></h1><p class="subheading" data-text="subtitle"></p></div><span class="connection" id="connectionBadge"></span></div>
<p class="notice" id="setupNotice"></p><p id="message" class="message" role="status" aria-live="polite"></p>
<section id="authPanel" class="card auth-panel"><div><p class="eyebrow">RESEARCH TEAM</p><h2 data-text="loginTitle"></h2><p data-text="loginHint"></p><form id="emailForm"><label><span data-text="email"></span><input type="email" id="adminEmail" required maxlength="254" autocomplete="email" dir="ltr"></label><button type="submit" class="primary" data-text="sendCode"></button></form><form id="codeForm" hidden><label><span data-text="code"></span><input id="adminCode" type="text" inputmode="numeric" pattern="[0-9۰-۹٠-٩]{6}" maxlength="6" autocomplete="one-time-code" dir="ltr" required></label><button type="submit" class="primary" data-text="verify"></button></form><button type="button" id="previewAdmin" class="secondary" data-text="preview"></button></div><div class="auth-aside"><span class="auth-symbol">8</span><h3 data-text="eightTitle"></h3><p data-text="eightHint"></p><p class="privacy-note" data-text="privacy"></p></div></section>
<section id="dashboard" hidden><div class="study-toolbar"><label><span data-text="studyId"></span><input id="studyId" type="text" dir="ltr" maxlength="64" value="almab-factorial-test-v3" pattern="[a-z0-9][a-z0-9_-]{2,63}"></label><button type="button" id="refresh" class="primary" data-text="refresh"></button><button type="button" id="signOut" class="secondary" data-text="signOut"></button></div>
<div class="study-meta" id="studyMeta"></div><div class="metrics" id="metrics"></div>
<div class="section-heading"><h2 data-text="groupTitle"></h2><p data-text="groupHint"></p></div><div class="group-grid" id="groupGrid"></div>
<section class="card records"><div class="section-heading"><div><p class="eyebrow">PARTICIPANTS</p><h2 data-text="recordsTitle"></h2></div><span id="recordCount"></span></div>
<form id="filters" class="filter-bar"><label><span data-text="condition"></span><select id="conditionFilter"><option value="" data-text="all"></option></select></label><label><span data-text="status"></span><select id="statusFilter"><option value="" data-text="all"></option><option value="in_progress" data-text="in_progress"></option><option value="completed" data-text="completed"></option></select></label><label class="school-filter"><span data-text="university"></span><input id="schoolFilter" type="text" maxlength="160"></label><label><span data-text="fromDate"></span><input id="fromFilter" type="date" dir="ltr"></label><label><span data-text="toDate"></span><input id="toFilter" type="date" dir="ltr"></label><button type="submit" class="secondary" data-text="filter"></button></form>
<div class="table-wrap"><table><thead><tr><th data-text="participant"></th><th data-text="condition"></th><th data-text="university"></th><th data-text="status"></th><th data-text="amount"></th><th data-text="upfEnergy"></th><th></th></tr></thead><tbody id="participantRows"></tbody></table></div><div class="pagination"><button type="button" id="firstPage" class="secondary" data-text="firstPage"></button><button type="button" id="nextPage" class="secondary" data-text="nextPage"></button><span id="pageNote"></span></div>
</section>
<section class="card export-panel"><div><p class="eyebrow">DATA EXPORT</p><h2 data-text="exportTitle"></h2><p data-text="exportHint"></p></div><div class="export-buttons"><button data-export="participants" class="primary" data-text="participantsExport"></button><button data-export="purchases" class="secondary" data-text="purchasesExport"></button><button data-export="events" class="secondary" data-text="eventsExport"></button><button data-export="catalog" class="secondary" data-text="catalogExport"></button><button id="dictionary" class="text-button" data-text="dictionary"></button><button id="manifest" class="text-button" data-text="manifest"></button></div><p class="privacy-note" data-text="exportPrivacy"></p></section>
</section><footer><a href="./" data-text="back"></a><span>CAMPUS SHELF · 0.9</span></footer></main>
<dialog id="detailDialog"><div class="dialog-heading"><h2 data-text="detailTitle"></h2><button id="closeDetail" class="secondary" aria-label="Close">×</button></div><div id="detailContent"></div></dialog>
<noscript>Please enable JavaScript.</noscript></body></html>
